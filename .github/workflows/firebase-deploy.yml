name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # ⚡ Remove FirebaseExtended/action-hosting-deploy@v0 — we’ll just use the CLI
      - name: Deploy to Firebase Hosting
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "🚀 Deploying to DEV..."
            firebase deploy --only hosting:dev --token $FIREBASE_TOKEN
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "🚀 Deploying to PROD..."
            firebase deploy --only hosting:prod --token $FIREBASE_TOKEN
          else
            echo "🛑 Not a deploy branch. Skipping."
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
