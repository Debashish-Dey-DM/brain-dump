name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm' # ✅ Enable caching for node_modules

      - name: Install dependencies
        run: npm ci

      # 🧱 Build depending on the branch
      - name: Build project (Dev or Prod)
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "🛠️ Building DEV environment..."
            npm run build:dev
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "🛠️ Building PROD environment..."
            npm run build:prod
          else
            echo "⚠️ Not a deploy branch. Skipping build."
            exit 0
          fi

      # 🔥 Install Firebase CLI (needed for deploy)
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 🚀 Deploy to Firebase Hosting based on branch
      - name: Deploy to Firebase Hosting
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "🚀 Deploying to DEV site (brainunload-2f04e)..."
            firebase deploy --only hosting:brainunload-2f04e --token $FIREBASE_TOKEN
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "🚀 Deploying to PROD site (brain-unload-prod)..."
            firebase deploy --only hosting:brain-unload-prod --token $FIREBASE_TOKEN
          else
            echo "🛑 Not a deploy branch. Skipping deployment."
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
